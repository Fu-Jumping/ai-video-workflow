name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:v0.2
      - name: LibTV adapter mock tests
        run: pnpm --filter ./apps/cli exec vitest run tests/libtv-plan.test.ts tests/libtv-apply.test.ts tests/libtv-cli.test.ts
